name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-verification.txt
      - name: Install offline mathematical verification dependencies
        run: python3 -m pip install -r requirements-verification.txt
      - name: Install browser test dependencies
        run: npm ci
      - name: Validate data and diagnosis engine
        run: |
          python3 scripts/validate.py
          python3 scripts/verify_questions.py --check
          python3 scripts/check_answer_review.py
          python3 scripts/check_remaining_review.py
          python3 scripts/check_manual_review.py
          python3 scripts/check_remaining_105.py
          python3 -m unittest discover -s tests -p 'test_*.py'
          npm test
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Test phone, tablet, desktop and update recovery
        env:
          PLAYWRIGHT_WEBKIT: '1'
        run: npm run test:browser
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-test-failures
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
      - name: Build versioned site
        run: python3 scripts/build_site.py --version "$GITHUB_SHA"
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6.0.0
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5.0.1
